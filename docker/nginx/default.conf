server {
    listen 80;
    server_name localhost;

    root /var/www/html/public;

    index index.php index.html index.htm;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        # Resolve the php-fpm host at request time via Docker's embedded DNS
        # (127.0.0.11) instead of at config-parse time. Passing the upstream
        # through a variable stops nginx from crashing on boot when the `app`
        # container isn't registered in DNS yet ("host not found in upstream").
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream_app app:9000;

        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        fastcgi_pass $upstream_app;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    location ~* \.(jpg|jpeg|gif|css|png|js|ico)$ {
        try_files $uri =404;
        expires max;
        log_not_found off;
    }

    error_log /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
}