openapi: 3.1.0
info:
  title: php-news API
  version: 1.0.0
  description: |
    HTTP API of the php-news project.

    Two surfaces:
      - `/api/*`        public client API (no auth).
      - `/admin/api/*`  admin API protected by JWT bearer (obtained from `/admin/api/login_check`).

servers:
  - url: http://localhost:8080

tags:
  - name: client
    description: Public read API + comment posting.
  - name: auth
    description: JWT login.
  - name: admin-articles
  - name: admin-categories
  - name: admin-comments

# Bearer JWT applied selectively to /admin/api/* operations.
security: []

paths:

  # ─────────────────────────────────────────────────────────────────────────
  # CLIENT (public)
  # ─────────────────────────────────────────────────────────────────────────

  /api/top-news:
    get:
      tags: [client]
      operationId: getTopNews
      summary: List categories with their current top articles.
      responses:
        '200':
          description: Array of categories, each carrying its top articles.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, title, articles]
                  properties:
                    id: { type: integer, minimum: 1 }
                    title: { type: string }
                    articles:
                      type: array
                      items: { $ref: '#/components/schemas/Article' }

  /api/article/{article_id}:
    get:
      tags: [client]
      operationId: getArticle
      summary: Get one article by id.
      parameters:
        - name: article_id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Article found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Article' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/category/{category_id}/articles/{page_id}:
    get:
      tags: [client]
      operationId: getArticlesByCategory
      summary: Paginated articles for a category (10 per page, newest first).
      parameters:
        - name: category_id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - name: page_id
          in: path
          required: true
          schema: { type: integer, minimum: 1, default: 1 }
      responses:
        '200':
          description: Page of articles + category preview.
          content:
            application/json:
              schema:
                type: object
                required: [articles, category]
                properties:
                  articles:
                    type: array
                    items: { $ref: '#/components/schemas/Article' }
                  category: { $ref: '#/components/schemas/CategoryPreview' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/article/{article_id}/comments:
    get:
      tags: [client]
      operationId: getArticleComments
      summary: Comments for an article (public).
      parameters:
        - name: article_id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Array of comments (possibly empty).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Comment' }
    post:
      tags: [client]
      operationId: postArticleComment
      summary: Post a comment on an article.
      parameters:
        - name: article_id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [author, content]
              properties:
                author:  { type: string, minLength: 1, maxLength: 250 }
                content: { type: string, minLength: 1 }
      responses:
        '201':
          description: Comment created.
          content:
            application/json:
              schema:
                type: object
                required: [ok, id, status]
                properties:
                  ok:     { type: boolean }
                  id:     { type: integer, minimum: 1 }
                  status: { type: string }
        '400': { $ref: '#/components/responses/ValidationFailed' }

  # ─────────────────────────────────────────────────────────────────────────
  # AUTH
  # ─────────────────────────────────────────────────────────────────────────

  /admin/api/login_check:
    post:
      tags: [auth]
      operationId: login
      summary: Exchange email/password for a JWT.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, format: email, maxLength: 180 }
                password: { type: string, minLength: 1 }
      responses:
        '200':
          description: 'Authenticated. Returns a JWT to send as `Authorization: Bearer <token>`.'
          content:
            application/json:
              schema:
                type: object
                required: [token]
                properties:
                  token: { type: string, minLength: 1 }
        '401':
          description: Invalid credentials.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:    { type: integer }
                  message: { type: string }

  # ─────────────────────────────────────────────────────────────────────────
  # ADMIN — ARTICLES
  # ─────────────────────────────────────────────────────────────────────────

  /admin/api/articles/{page_id}:
    get:
      tags: [admin-articles]
      operationId: adminListArticles
      summary: Paginated article list for admin.
      security: [ { bearerAuth: [] } ]
      parameters:
        - name: page_id
          in: path
          required: true
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Array of articles.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Article' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /admin/api/article:
    post:
      tags: [admin-articles]
      operationId: adminCreateArticle
      summary: Create an article.
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, shortDescription, content, categories]
              properties:
                title:            { type: string, minLength: 1, maxLength: 255 }
                shortDescription: { type: string, minLength: 1, maxLength: 500 }
                content:          { type: string, minLength: 1 }
                imageID:
                  type: [integer, 'null']
                  minimum: 1
                categories:
                  type: array
                  minItems: 1
                  items: { type: integer, minimum: 1 }
      responses:
        '201':
          description: Article created.
          content:
            application/json:
              schema:
                type: object
                required: [status, article_id]
                properties:
                  status:     { type: string }
                  article_id: { type: integer, minimum: 1 }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /admin/api/article/{article_id}:
    parameters:
      - name: article_id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      tags: [admin-articles]
      operationId: adminGetArticle
      summary: Get one article (admin).
      security: [ { bearerAuth: [] } ]
      responses:
        '200':
          description: Article found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Article' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [admin-articles]
      operationId: adminUpdateArticle
      summary: Update an article.
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, shortDescription, content, categories]
              properties:
                title:            { type: string, minLength: 1, maxLength: 255 }
                shortDescription: { type: string, minLength: 1, maxLength: 500 }
                content:          { type: string, minLength: 1 }
                imageID:
                  type: [integer, 'null']
                  minimum: 0
                categories:
                  type: array
                  minItems: 1
                  items: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Article updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [admin-articles]
      operationId: adminDeleteArticle
      summary: Delete an article.
      security: [ { bearerAuth: [] } ]
      responses:
        '200':
          description: Article deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/api/articles/image/upload:
    post:
      tags: [admin-articles]
      operationId: adminUploadArticleImage
      summary: Upload an article image (multipart, field name `image`).
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
                  description: JPEG or PNG, max 5 MiB.
            encoding:
              image:
                contentType: image/jpeg, image/png
      responses:
        '200':
          description: Image stored.
          content:
            application/json:
              schema:
                type: object
                required: [id, file_name]
                properties:
                  id:        { type: integer, minimum: 1 }
                  file_name: { type: string, minLength: 1 }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ─────────────────────────────────────────────────────────────────────────
  # ADMIN — CATEGORIES
  # ─────────────────────────────────────────────────────────────────────────

  /admin/api/category:
    get:
      tags: [admin-categories]
      operationId: adminListCategories
      summary: All categories.
      security: [ { bearerAuth: [] } ]
      responses:
        '200':
          description: Array of categories.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CategoryPreview' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [admin-categories]
      operationId: adminCreateCategory
      summary: Create a category.
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, minLength: 1, maxLength: 255 }
      responses:
        '201':
          description: Category created.
          content:
            application/json:
              schema:
                type: object
                required: [status, category_id]
                properties:
                  status:      { type: string }
                  category_id: { type: integer, minimum: 1 }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /admin/api/category/{category_id}:
    parameters:
      - name: category_id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      tags: [admin-categories]
      operationId: adminGetCategory
      summary: Get one category.
      security: [ { bearerAuth: [] } ]
      responses:
        '200':
          description: Category found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategoryPreview' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [admin-categories]
      operationId: adminUpdateCategory
      summary: Update a category title.
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, minLength: 1, maxLength: 255 }
      responses:
        '200':
          description: Category updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [admin-categories]
      operationId: adminDeleteCategory
      summary: Delete a category.
      security: [ { bearerAuth: [] } ]
      responses:
        '200':
          description: Category deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ─────────────────────────────────────────────────────────────────────────
  # ADMIN — COMMENTS
  # ─────────────────────────────────────────────────────────────────────────

  /admin/api/article/{article_id}/comments:
    get:
      tags: [admin-comments]
      operationId: adminGetArticleComments
      summary: Comments of an article (admin).
      security: [ { bearerAuth: [] } ]
      parameters:
        - name: article_id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Array of comments.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Comment' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /admin/api/comment/{comment_id}:
    delete:
      tags: [admin-comments]
      operationId: adminDeleteComment
      summary: Delete a comment.
      security: [ { bearerAuth: [] } ]
      parameters:
        - name: comment_id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Comment deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  # Reusable response wrappers — used by many admin endpoints,
  # kept here to avoid repeating the same body inline 10+ times.
  responses:
    Unauthorized:
      description: Missing or invalid JWT.
      content:
        application/json:
          schema:
            type: object
            properties:
              code:    { type: integer }
              message: { type: string }
    NotFound:
      description: Domain entity not found (mapped from `EntityNotFoundException`).
      content:
        application/json:
          schema:
            type: object
            required: [ok, message]
            properties:
              ok:      { type: boolean, enum: [false] }
              message: { type: string }
    ValidationFailed:
      description: Request body failed validation (from `BaseRequest` rules).
      content:
        application/json:
          schema:
            type: object
            required: [ok, message, errors]
            properties:
              ok:      { type: boolean, enum: [false] }
              message: { type: string, enum: [validation_failed] }
              errors:
                type: array
                items:
                  type: object
                  required: [property, message]
                  properties:
                    property: { type: string }
                    value:    {}
                    message:  { type: string }

  # Three schemas reused across 3+ endpoints each; everything else inline.
  schemas:
    Article:
      type: object
      required: [id, title, shortDescription, content, numberOfViews, isTop, categories]
      properties:
        id:               { type: integer, minimum: 1 }
        title:            { type: string, minLength: 1, maxLength: 255 }
        shortDescription: { type: string, minLength: 1, maxLength: 500 }
        content:          { type: string, minLength: 1 }
        numberOfViews:    { type: integer, minimum: 0 }
        isTop:            { type: boolean }
        image:
          type: [object, 'null']
          properties:
            id:       { type: [integer, 'null'], minimum: 1 }
            fileName: { type: [string, 'null'] }
        categories:
          type: array
          items: { $ref: '#/components/schemas/CategoryPreview' }

    CategoryPreview:
      type: object
      required: [id, title]
      properties:
        id:    { type: integer, minimum: 1 }
        title: { type: string, minLength: 1, maxLength: 255 }

    Comment:
      type: object
      required: [id, author, content]
      properties:
        id:      { type: integer, minimum: 1 }
        author:  { type: string, minLength: 2, maxLength: 250 }
        content: { type: string, minLength: 1 }
